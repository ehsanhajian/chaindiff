[project]
name = "chaindiff"
version = "0.1.0"
description = "Decide whether an Ethereum node client upgrade is safe."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["ethereum", "blockchain", "geth", "node", "upgrade", "cli"]
authors = [{ name = "ehsanhajian" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/ehsanhajian/chaindiff"
Repository = "https://github.com/ehsanhajian/chaindiff"
Issues = "https://github.com/ehsanhajian/chaindiff/issues"
Changelog = "https://github.com/ehsanhajian/chaindiff/releases"

[project.scripts]
chaindiff = "chaindiff.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chaindiff = ["data/*.json", "data/releases/*.json", "data/advisories/*.json", "data/flags/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
