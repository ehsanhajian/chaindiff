name: Refresh client releases

on:
  schedule:
    # 06:15 UTC on Monday and Thursday.
    - cron: "15 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-releases
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ChainDiff
        run: pip install -e ".[dev]"
      - name: Remember stable tags
        run: python -m chaindiff.versionbump snapshot . new-stable-before.json
      - name: Refresh release catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: chaindiff refresh
      - name: Bump the patch version for a new stable tag
        run: python -m chaindiff.versionbump bump-if-new . new-stable-before.json new-stable.txt
      - name: Test
        run: pytest
      - name: Open a catalog pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add src/chaindiff/data/releases pyproject.toml src/chaindiff/__init__.py
          if git diff --cached --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          # main requires a signed commit. A local git commit from Actions is unsigned,
          # and GitHub rejects the squash while that commit is on the pull request.
          # The Commits API signs this commit as github-actions[bot] when the request
          # sets no author and no committer.
          set -o pipefail
          branch="catalog/refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ -s new-stable.txt ]; then
            message=$(cat new-stable-commit.txt)
            title="ChainDiff $(cat new-version.txt)"
            body="new-stable.txt"
          else
            message="Refresh client release catalog"
            title="Refresh client release catalog"
            body=""
          fi
          parent=$(git rev-parse HEAD)
          base_tree=$(git rev-parse "HEAD^{tree}")
          entries='[]'
          while IFS= read -r -d '' path; do
            blob=$(jq -n --rawfile content "$path" '{content:$content,encoding:"utf-8"}' \
              | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)
            entries=$(jq -n --arg path "$path" --arg sha "$blob" --argjson entries "$entries" \
              '$entries + [{path:$path,mode:"100644",type:"blob",sha:$sha}]')
          done < <(git diff --cached --name-only -z --diff-filter=ACMR)
          tree=$(jq -n --arg base "$base_tree" --argjson tree "$entries" '{base_tree:$base,tree:$tree}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)
          jq -n --arg message "$message" --arg tree "$tree" --arg parent "$parent" \
            '{message:$message,tree:$tree,parents:[$parent]}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - > commit.json
          commit_sha=$(jq -r .sha commit.json)
          verified=$(jq -r '.verification.verified' commit.json)
          reason=$(jq -r '.verification.reason' commit.json)
          if [ "$verified" != "true" ]; then
            echo "Catalog commit ${commit_sha} is not verified (${reason})."
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/${branch}" \
            -f sha="$commit_sha"
          if [ -n "$body" ]; then
            gh pr create --base main --head "$branch" --title "$title" --body-file "$body"
          else
            gh pr create --base main --head "$branch" --title "$title" --body "Scheduled update of the client release catalog."
          fi
          gh pr merge --squash --delete-branch
          if [ -s new-stable.txt ]; then
            git fetch origin main
            sha=$(git rev-parse origin/main)
            version=$(cat new-version.txt)
            gh release view "v${version}" >/dev/null 2>&1 || gh release create "v${version}" --target "$sha" --title "ChainDiff ${version}" --notes-file new-stable.txt
          fi
