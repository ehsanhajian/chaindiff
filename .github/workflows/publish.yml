name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Refresh client releases"]
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    if: github.event_name == 'release' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || 'main' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Skip a version already on PyPI
        id: check
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/chaindiff/${version}/json")
          if [ "$code" = "200" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "chaindiff ${version} is already on PyPI"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: |
          pip install build
          python -m build
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
